{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}{% if object %}Update{% else %}Add{% endif %} Reference{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header"><h3 class="mb-0">{% if object %}Update{% else %}Add{% endif %} Reference</h3></div>
    <div class="card-body">
        <form method="post" class="col-lg-6 px-0">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
            <a href="{% url 'sales:reference-list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
