{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Add Bank Account{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h3 class="mb-0">Add Bank Account</h3>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="mt-3">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
                <a href="{% url 'books:bankaccount_list' %}" class="btn btn-secondary"><i class="fas fa-times"></i> Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
