{% extends "base.html" %}

{% block title %}Reset Email Sent{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card mt-5">
            <div class="card-body text-center">
                <i class="fas fa-envelope-open-text fa-3x text-primary mb-3"></i>
                <h5>Check your email</h5>
                <p class="text-muted">We've emailed you instructions for setting your password, if an account exists with the email you entered.</p>
                <a href="{% url 'login' %}" class="btn btn-primary">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
