{% extends "base.html" %}

{% block title %}Delete Project{% endblock %}

{% block content %}
<div class="card border-danger">
    <div class="card-header bg-danger text-white"><h3 class="mb-0"><i class="fas fa-exclamation-triangle"></i> Delete project</h3></div>
    <div class="card-body">
        <p>Delete <strong>{{ object }}</strong>? A project that still has buildings or director investments cannot be deleted.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Delete</button>
            <a href="{{ object.get_absolute_url }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
